[workspace]
resolver = "2"
members = [
    "crates/jamnp-s",
    "crates/m2-reference",
    "crates/m2-emu",
    "crates/m2-scenario",
    "crates/m2-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/paritytech/jam-m2-conformance"

# Polkajam reference-engine crates are git dependencies pinned to a commit
# (DESIGN.md §8). Nothing from polkajam is vendored into this repository; the
# two local patches in `patches/` apply only to the NUT *binary*, built by
# `scripts/prepare-nut.sh` into the gitignored `third_party/`.
[workspace.dependencies]
jam-types = { git = "ssh://git@github.com/paritytech/polkajam.git", rev = "323e72ded3a03135db41563ffff56e98d5342d1d" }
jam-std-common = { git = "ssh://git@github.com/paritytech/polkajam.git", rev = "323e72ded3a03135db41563ffff56e98d5342d1d" }
jam-node = { git = "ssh://git@github.com/paritytech/polkajam.git", rev = "323e72ded3a03135db41563ffff56e98d5342d1d", features = ["hazmat"] }
polkajam-fuzz = { git = "ssh://git@github.com/paritytech/polkajam.git", rev = "323e72ded3a03135db41563ffff56e98d5342d1d" }

quinn = { version = "0.11", features = ["rustls", "runtime-tokio", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", features = ["ring"] }
ed25519-consensus = { version = "2.1.0" }
x509-parser = "0.17"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
clap = { version = "4.5.13", features = ["derive", "string"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "2.0"
blake2b_simd = "1"
rand = "0.8"

[profile.release]
opt-level = 2
