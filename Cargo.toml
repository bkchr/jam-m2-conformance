[workspace]
resolver = "2"
members = [
    "crates/jamnp-s",
    "crates/m2-reference",
    "crates/m2-emu",
    "crates/m2-scenario",
    "crates/m2-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/paritytech/jam-m2-conformance"

# Polkajam reference-engine crates are git dependencies pinned to a commit
# (DESIGN.md §8). Nothing from polkajam is vendored into this repository.
#
# This pin is the single source of the polkajam revision: `scripts/prepare-nut.sh`
# reads it from here to build the NUT *binary* into the gitignored `third_party/`,
# so the node under test and the engine that grades it are the same build.
# Re-pinning is deliberate -- upstream HEAD has broken this workspace three times
# in four weeks -- so move it at most once per milestone, in a commit of its own
# that records what changed in the genesis writer and the hazmat exports.
[workspace.dependencies]
jam-types = { git = "ssh://git@github.com/paritytech/polkajam.git", rev = "940ef56c7a2a601bccfd2a8d2375be48dc0fb941" }
jam-std-common = { git = "ssh://git@github.com/paritytech/polkajam.git", rev = "940ef56c7a2a601bccfd2a8d2375be48dc0fb941" }
jam-node = { git = "ssh://git@github.com/paritytech/polkajam.git", rev = "940ef56c7a2a601bccfd2a8d2375be48dc0fb941", features = ["hazmat"] }
polkajam-fuzz = { git = "ssh://git@github.com/paritytech/polkajam.git", rev = "940ef56c7a2a601bccfd2a8d2375be48dc0fb941" }

quinn = { version = "0.11", features = ["rustls", "runtime-tokio", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", features = ["ring"] }
ed25519-consensus = { version = "2.1.0" }
x509-parser = "0.17"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
clap = { version = "4.5.13", features = ["derive", "string"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "2.0"
blake2b_simd = "1"
rand = "0.8"

[profile.release]
opt-level = 2

# `jam-node`'s build script embeds the `jam-bootstrap-service` blob only when the
# profile says `debug = false`; otherwise it defers the build to the first call at
# runtime, which resolves the workspace from the *caller's* working directory. For
# a test that is its own crate root, so the lookup lands in this workspace, where
# no such package exists. Building jam-node without debug info keeps the blob
# baked in and every `RefChain` test runnable.
[profile.dev.package.jam-node]
debug = false
