[package]
name = "m2-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI runner: spec+keygen, NUT launch, scenario execution, report/findings/trace output"

[[bin]]
name = "m2-runner"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
jam-types = { workspace = true }
jam-std-common = { workspace = true }
jam-node = { workspace = true }
codec = { package = "jam-codec", version = "0.1.1", default-features = false, features = ["derive", "max-encoded-len"] }
ed25519-consensus = { workspace = true }
m2-scenario = { path = "../../crates/m2-scenario" }
jamnp-s = { path = "../../crates/jamnp-s" }

[dev-dependencies]
m2-reference = { path = "../../crates/m2-reference" }
